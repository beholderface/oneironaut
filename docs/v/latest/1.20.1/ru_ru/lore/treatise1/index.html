      <meta property="og:description" content="Хотя большинство йот можно создавать непосредственно во время каста, бывают случаи, когда это непрактично или вовсе невозможно (например, очень большие и точные числа или ссылки на сущности), и тогда нужную йоту приходится получать иным способом. Прочесть её из Фокуса или подобного предмета вполне подходит, но во многих случаях для этого потребовалась бы третья рука, которой у меня нет. Другие методы извлечения йот из внешних источников также имеют свои ограничения." />
