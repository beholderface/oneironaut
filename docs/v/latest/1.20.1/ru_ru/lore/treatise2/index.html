      <meta property="og:description" content="Когда требуется придать чему-либо движение, стандартный метод — использование Импульса. Однако это может стать непозволительно дорогим, если нужно заставить что-то двигаться чрезвычайно быстро, так как стоимость растёт экспоненциально с длиной вектора. Этого можно избежать, просто используя Импульс величиной 1 много раз на одной цели, превращая общую стоимость из n^2 в 2n-1, где n — величина вектора." />
